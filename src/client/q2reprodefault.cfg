// Gamepad default bindings; very much based on thererelease bindings,
// but fully specified here for the benefit of vanilla, and with some tweaks

bind LEFT_STICK "+movedown"
bind RIGHT_STICK "centerview"
bind LEFT_SHOULDER "+wheel2"
bind RIGHT_SHOULDER "+wheel"
bind DPAD_UP "wave 4"
bind DPAD_DOWN "invuse"
bind DPAD_LEFT "cl_weapprev"
bind DPAD_RIGHT "cl_weapnext"
bind A_BUTTON "+moveup"
bind B_BUTTON "+movedown"
bind X_BUTTON "cmd help"
bind Y_BUTTON "inven"
bind LEFT_TRIGGER "+moveup"
bind RIGHT_TRIGGER "+attack"
bind RIGHT_PADDLE1 "+altmodifier"
bind TOUCHPAD "+wheel2"
bind MISC2 "+wheel"
bind PAD_VIEW "cmd help"
